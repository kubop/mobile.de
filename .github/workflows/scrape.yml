name: scrape and publish

# Scrapes the configured mobile.de search, commits the new history, and republishes the
# dashboard to GitHub Pages.
#
# Why this works on a GitHub runner at all: mobile.de blocks plain HTTP and headless Chrome,
# but serves a real Chrome that was started as an ordinary process. xvfb provides the display
# that makes "headed" possible on a runner. Verified by .github/workflows/probe-cloud.yml —
# the runner's Azure IP is not itself a problem.

on:
  schedule:
    # Every 6 hours, at :17 rather than on the hour — scheduled runs are best-effort and GitHub
    # delays them most when the top of the hour is busy. 4 runs a day, 2 page fetches each.
    # config.json's minMinutesBetweenRuns must stay well under 360 or this silently skips runs.
    #
    # This was every 2 hours until Akamai Bot Manager started denying about two thirds of runs.
    # 24 search fetches a day against a path robots.txt disallows was the load most likely to
    # have earned that; a search this small barely resolves finer than 6 hours anyway.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the minimum-interval guard"
        type: boolean
        default: false
  # Smoke-test the pipeline whenever the pipeline itself changes. Self-limiting: only this
  # file. The minimum-interval guard means such a run usually skips the network entirely and
  # just exercises the import -> export -> build -> publish plumbing.
  push:
    branches: [main]
    paths:
      - ".github/workflows/scrape.yml"

permissions:
  contents: write # commit the new history
  pages: write # publish the dashboard
  id-token: write # required by deploy-pages
  actions: write # delete a cached token that turned out to be unwelcome

# Never let two scrapes overlap; a queued one waits rather than doubling up on requests.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scraped: ${{ steps.scrape.outputs.scraped }}
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Rebuild database from committed history
        run: node --experimental-sqlite --no-warnings src/history.js import

      # Akamai Bot Manager issues a year-long `_abck` trust token and a family of `bm_*`
      # cookies; presenting them again is what keeps a run from looking like a brand-new
      # cookie-less client. Only the cookie store is cached — a full Chrome profile is ~130 MB
      # of model and metrics data that Chrome recreates on its own. browser.js pins cookie
      # encryption to Chrome's built-in key so the store survives the move between runners.
      #
      # actions/cache never overwrites an existing key, so each run saves under its own run id
      # and restores whichever previous one is newest.
      #
      # **On the runner Chrome keeps its cookies at `Default/Cookies`, not
      # `Default/Network/Cookies`.** That second path is the Windows layout, and hardcoding it
      # meant no `chrome-cookies-*` cache was written once between 2026-08-11 and 2026-09-01 —
      # every run in that window reached mobile.de as a first-time client, which is the state
      # Akamai challenges. actions/cache and `hashFiles()` were both reporting the truth; a path
      # that resolves to nothing is a warning rather than a failure, so it stayed green and
      # silent for three weeks. Hence: locate the store, record where it was found so the restore
      # puts it back there, and have both steps say out loud what they saw.
      - name: Restore Chrome cookie store
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: chrome-cookies
          key: chrome-cookies-${{ github.run_id }}
          restore-keys: chrome-cookies-

      - name: Load the restored cookies into the profile
        run: |
          if [ ! -f chrome-cookies/Cookies ]; then
            echo "::warning::no cached cookie store — this run starts cold and may be denied"
            exit 0
          fi
          # The cache records where Chrome actually kept the store, because that path is not
          # the same everywhere and hardcoding it is what broke this for three weeks.
          dest=$(cat chrome-cookies/path 2>/dev/null || echo .chrome-profile/Default/Network/Cookies)
          mkdir -p "$(dirname "$dest")"
          cp -a chrome-cookies/Cookies "$dest"
          [ -f chrome-cookies/Cookies-journal ] && cp -a chrome-cookies/Cookies-journal "$dest-journal"
          echo "restored cookie store into $dest ($(stat -c%s "$dest") bytes)"

      - name: Scrape
        id: scrape
        run: |
          set -o pipefail
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          # Headed Chrome needs a display; a headless one is blocked.
          if xvfb-run -a --server-args="-screen 0 1440x900x24" \
               node --experimental-sqlite --no-warnings src/scrape.js $FORCE 2>&1 | tee scrape.out; then
            echo "scraped=true" >> "$GITHUB_OUTPUT"
          else
            echo "scraped=false" >> "$GITHUB_OUTPUT"
            echo "::error::scrape failed — see the log above"
            exit 1
          fi

      # Cached only after a success. A denied run's `_abck` carries Akamai's rejection, so
      # keeping it would hand the next run a token already known to fail rather than a clean
      # slate.
      - name: Stage the cookie store for caching
        id: cookies
        # Runs even on a denied scrape, because where Chrome put its profile is worth knowing
        # either way; only the caching itself is gated on success.
        if: always()
        run: |
          # Newest wins: both layouts can exist in one profile (Chrome 96 moved the store to
          # Default/Network/ and leaves the old file behind when it migrates), and the live one
          # is whichever was written last. Picking by find(1) order would be a coin toss.
          found=$(find .chrome-profile -name Cookies -type f -exec ls -t {} + 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "::warning::no Chrome cookie store anywhere under .chrome-profile"
            find .chrome-profile -maxdepth 2 2>/dev/null | head -30 || echo "(no .chrome-profile at all)"
            exit 0
          fi
          # A store with zero rows is the failure this whole mechanism exists to avoid: it looks
          # like a cache hit to the next run while carrying no trust token at all. That is what
          # keepProfile persisted before browser.js learned to shut Chrome down gracefully.
          rows=$(node --experimental-sqlite --no-warnings -e '
            const { DatabaseSync } = require("node:sqlite");
            const db = new DatabaseSync(process.argv[1], { readOnly: true });
            process.stdout.write(String(db.prepare("SELECT COUNT(*) AS n FROM cookies").get().n));
          ' "$found" 2>/dev/null || echo 0)
          echo "cookie store at $found — $(stat -c%s "$found") bytes, $rows rows"
          if [ "${{ steps.scrape.outputs.scraped }}" != "true" ]; then
            echo "scrape did not succeed — not caching this run's token"
            exit 0
          fi
          if [ "$rows" -eq 0 ]; then
            echo "::warning::cookie store has no rows — refusing to cache an empty token"
            exit 0
          fi
          rm -rf chrome-cookies
          mkdir -p chrome-cookies
          cp -a "$found" chrome-cookies/Cookies
          [ -f "$found-journal" ] && cp -a "$found-journal" chrome-cookies/Cookies-journal
          echo "$found" > chrome-cookies/path
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save Chrome cookie store
        if: always() && steps.cookies.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: chrome-cookies
          key: chrome-cookies-${{ github.run_id }}

      # Every runner gets a different address out of the ~28 million GitHub publishes for
      # Actions, so a reused `_abck` is always presented from an IP that did not earn it. If
      # Akamai binds that token to network context, replaying it scores worse than arriving
      # cold — and cold demonstrably works, since every run up to 2026-09-01 was cookie-less
      # and 93% of them succeeded.
      #
      # Rather than guess which way it cuts, let the run say so: a token that was restored and
      # then blocked is a token worth throwing away. Only for an actual denial — a runner whose
      # Chrome failed to start says nothing about the cookies.
      - name: Drop the cached token after a denial
        if: always() && steps.scrape.outputs.scraped != 'true' && steps.restore.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "blocked by mobile.de" scrape.out 2>/dev/null; then
            echo "failure was not a block — keeping the cached token"
            exit 0
          fi
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100"                   --jq '.actions_caches[] | select(.key|startswith("chrome-cookies-")) | .id' || true)
          if [ -z "$ids" ]; then
            echo "no chrome-cookies caches to drop"
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null               && echo "dropped cache $id" || echo "could not drop cache $id"
          done
          echo "::warning::denied while presenting a restored token — dropped it so the next run starts cold"

      - name: Export history
        # Runs even on failure: a failed run is still recorded in the `run` table, and keeping
        # that record is how gaps in the history stay explainable.
        if: always()
        run: node --experimental-sqlite --no-warnings src/history.js export

      - name: Guard against history loss
        if: always()
        # The history is append-only. If it ever shrinks, something went wrong upstream (an
        # empty database because an earlier step died, say) and committing would destroy real
        # data. Refuse, and restore the committed version.
        run: |
          fail=0
          for t in run listing snapshot change event; do
            old=$(git show "HEAD:history/$t.ndjson" 2>/dev/null | wc -l || echo 0)
            new=$(wc -l < "history/$t.ndjson" 2>/dev/null || echo 0)
            echo "$t: $old -> $new"
            if [ "$new" -lt "$old" ]; then
              echo "::error::history/$t.ndjson shrank ($old -> $new lines) — refusing to commit"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            git checkout -- history/ 2>/dev/null || true
            exit 1
          fi

      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "no history changes to commit"
            exit 0
          fi
          SUMMARY=$(node -e "
            const fs=require('fs');
            const runs=fs.readFileSync('history/run.ndjson','utf8').trim().split('\n').map(JSON.parse);
            const r=runs[runs.length-1]??{};
            process.stdout.write(r.status==='ok'
              ? \`\${r.listings_seen} listings, \${r.new_count} new, \${r.removed_count} removed, \${r.changed_count} changed\`
              : \`run failed: \${(r.error??'unknown').slice(0,80)}\`);
          ")
          git commit -m "history: $SUMMARY [skip ci]"
          # Another run may have pushed in the meantime.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push attempt $i failed, retrying"; sleep 5
          done

      - name: Build dashboard
        id: build
        if: always()
        run: |
          node --experimental-sqlite --no-warnings src/build-site.js
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: always() && hashFiles('dist/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Scrape result"
            echo ""
            echo '```'
            tail -30 scrape.out 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: scrape
    # Publish even if the scrape failed, so the dashboard keeps showing the last good data
    # (with its "last attempt failed" banner) rather than going stale silently. Skipped only
    # when there is no artifact to deploy.
    if: always() && needs.scrape.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
