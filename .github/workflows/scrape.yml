name: scrape and publish

# Scrapes the configured mobile.de search, commits the new history, and republishes the
# dashboard to GitHub Pages.
#
# Why this works on a GitHub runner at all: mobile.de blocks plain HTTP and headless Chrome,
# but serves a real Chrome that was started as an ordinary process. xvfb provides the display
# that makes "headed" possible on a runner. Verified by .github/workflows/probe-cloud.yml —
# the runner's Azure IP is not itself a problem.

on:
  schedule:
    # Every 6 hours, at :17 rather than on the hour — scheduled runs are best-effort and GitHub
    # delays them most when the top of the hour is busy. 4 runs a day, 2 page fetches each.
    # config.json's minMinutesBetweenRuns must stay well under 360 or this silently skips runs.
    #
    # This was every 2 hours until Akamai Bot Manager started denying about two thirds of runs.
    # 24 search fetches a day against a path robots.txt disallows was the load most likely to
    # have earned that; a search this small barely resolves finer than 6 hours anyway.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the minimum-interval guard"
        type: boolean
        default: false
  # Smoke-test the pipeline whenever the pipeline itself changes. Self-limiting: only this
  # file. The minimum-interval guard means such a run usually skips the network entirely and
  # just exercises the import -> export -> build -> publish plumbing.
  push:
    branches: [main]
    paths:
      - ".github/workflows/scrape.yml"

permissions:
  contents: write # commit the new history
  pages: write # publish the dashboard
  id-token: write # required by deploy-pages
  actions: write # delete a cached token that turned out to be unwelcome

# Never let two scrapes overlap; a queued one waits rather than doubling up on requests.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scraped: ${{ steps.scrape.outputs.scraped }}
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Rebuild database from committed history
        run: node --experimental-sqlite --no-warnings src/history.js import

      # Akamai Bot Manager issues a year-long `_abck` trust token and a family of `bm_*`
      # cookies. Restoring those *alone* puts the browser in a state no real returning visitor is
      # ever in: it presents `bm_lso` — Akamai's local-storage marker — from a profile whose
      # localStorage is empty, and a History with no record of ever having been here. A sensor
      # script can read all three. So carry the small, consistent set rather than the cookie file
      # on its own; it comes to ~220 KB against the ~130 MB of model and metrics data that made
      # caching a whole profile pointless.
      #
      # Deliberately NOT cached: Service Worker. It is the largest part by far, and a stale
      # worker can serve a cached page instead of the live one, which would quietly poison the
      # scrape with yesterday's listings.
      #
      # The cache mirrors the profile's own layout, so restoring is a straight copy back and the
      # Windows/Linux split over where `Cookies` lives stops mattering. actions/cache never
      # overwrites an existing key, so each run saves under its own run id and restores whichever
      # previous one is newest.
      #
      # **On the runner Chrome keeps its cookies at `Default/Cookies`, not
      # `Default/Network/Cookies`.** That second path is the Windows layout, and hardcoding it
      # meant nothing was cached at all between 2026-08-11 and 2026-09-01 — every run in that
      # window reached mobile.de as a first-time client. actions/cache and `hashFiles()` were both
      # reporting the truth; a path that resolves to nothing is a warning rather than a failure,
      # so it stayed green and silent for three weeks.
      - name: Restore Chrome browser state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: chrome-state
          key: chrome-state-${{ github.run_id }}
          restore-keys: chrome-state-

      - name: Load the restored state into the profile
        run: |
          if [ ! -d chrome-state ]; then
            echo "::warning::no cached browser state — this run starts cold"
            exit 0
          fi
          mkdir -p .chrome-profile
          cp -a chrome-state/. .chrome-profile/
          echo "restored $(du -sk chrome-state | cut -f1) KB of profile:"
          find chrome-state -maxdepth 2 -mindepth 2 | sed 's|^chrome-state/|  |'

      - name: Scrape
        id: scrape
        run: |
          set -o pipefail
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          # Headed Chrome needs a display; a headless one is blocked.
          if xvfb-run -a --server-args="-screen 0 1440x900x24" \
               node --experimental-sqlite --no-warnings src/scrape.js $FORCE 2>&1 | tee scrape.out; then
            echo "scraped=true" >> "$GITHUB_OUTPUT"
          else
            echo "scraped=false" >> "$GITHUB_OUTPUT"
            echo "::error::scrape failed — see the log above"
            exit 1
          fi

      # Cached only after a success. A denied run's `_abck` carries Akamai's rejection, so
      # keeping it would hand the next run a token already known to fail rather than a clean
      # slate.
      - name: Stage the browser state for caching
        id: state
        # Runs even on a denied scrape, because where Chrome put its profile is worth knowing
        # either way; only the caching itself is gated on success.
        if: always()
        run: |
          # Newest wins: both cookie layouts can exist in one profile, since Chrome 96 leaves the
          # old file behind when it migrates, and only one of them is live.
          found=$(find .chrome-profile -name Cookies -type f -exec ls -t {} + 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "::warning::no Chrome cookie store anywhere under .chrome-profile"
            find .chrome-profile -maxdepth 2 2>/dev/null | head -30 || echo "(no .chrome-profile at all)"
            exit 0
          fi
          # A store with zero rows looks like a cache hit to the next run while carrying no trust
          # token at all — the failure this whole mechanism exists to avoid.
          rows=$(node --experimental-sqlite --no-warnings -e '
            const { DatabaseSync } = require("node:sqlite");
            const db = new DatabaseSync(process.argv[1], { readOnly: true });
            process.stdout.write(String(db.prepare("SELECT COUNT(*) AS n FROM cookies").get().n));
          ' "$found" 2>/dev/null || echo 0)
          echo "cookie store at $found — $(stat -c%s "$found") bytes, $rows rows"
          if [ "${{ steps.scrape.outputs.scraped }}" != "true" ]; then
            echo "scrape did not succeed — not caching this run's state"
            exit 0
          fi
          if [ "$rows" -eq 0 ]; then
            echo "::warning::cookie store has no rows — refusing to cache an empty token"
            exit 0
          fi
          rm -rf chrome-state
          copy_part() {
            [ -e ".chrome-profile/$1" ] || return 0
            mkdir -p "chrome-state/$(dirname "$1")"
            cp -a ".chrome-profile/$1" "chrome-state/$1"
            echo "  staged $1"
          }
          copy_part "Default/Cookies"
          copy_part "Default/Cookies-journal"
          copy_part "Default/Network"
          copy_part "Default/Local Storage"
          copy_part "Default/History"
          copy_part "Default/Preferences"
          echo "staged $(du -sk chrome-state | cut -f1) KB"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save Chrome browser state
        if: always() && steps.state.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: chrome-state
          key: chrome-state-${{ github.run_id }}

      # Every runner gets a different address out of the ~28 million GitHub publishes for
      # Actions, so restored state is always presented from an IP that did not earn it. If Akamai
      # binds `_abck` to network context, replaying it scores worse than arriving cold — and cold
      # demonstrably works, since every run up to 2026-09-01 was cookie-less and 93% succeeded.
      #
      # Rather than guess which way it cuts, let the run say so: state that was restored and then
      # blocked is state worth throwing away. Only for an actual denial — a runner whose Chrome
      # failed to start says nothing about the cookies.
      - name: Drop the cached state after a denial
        if: always() && steps.scrape.outputs.scraped != 'true' && steps.restore.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "blocked by mobile.de" scrape.out 2>/dev/null; then
            echo "failure was not a block — keeping the cached state"
            exit 0
          fi
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
                  --jq '.actions_caches[] | select(.key|startswith("chrome-state-")) | .id' || true)
          if [ -z "$ids" ]; then
            echo "no chrome-state caches to drop"
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null \
              && echo "dropped cache $id" || echo "could not drop cache $id"
          done
          echo "::warning::denied while presenting restored state — dropped it so the next run starts cold"

      - name: Export history
        # Runs even on failure: a failed run is still recorded in the `run` table, and keeping
        # that record is how gaps in the history stay explainable.
        if: always()
        run: node --experimental-sqlite --no-warnings src/history.js export

      - name: Guard against history loss
        if: always()
        # The history is append-only. If it ever shrinks, something went wrong upstream (an
        # empty database because an earlier step died, say) and committing would destroy real
        # data. Refuse, and restore the committed version.
        run: |
          fail=0
          for t in run listing snapshot change event; do
            old=$(git show "HEAD:history/$t.ndjson" 2>/dev/null | wc -l || echo 0)
            new=$(wc -l < "history/$t.ndjson" 2>/dev/null || echo 0)
            echo "$t: $old -> $new"
            if [ "$new" -lt "$old" ]; then
              echo "::error::history/$t.ndjson shrank ($old -> $new lines) — refusing to commit"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            git checkout -- history/ 2>/dev/null || true
            exit 1
          fi

      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "no history changes to commit"
            exit 0
          fi
          SUMMARY=$(node -e "
            const fs=require('fs');
            const runs=fs.readFileSync('history/run.ndjson','utf8').trim().split('\n').map(JSON.parse);
            const r=runs[runs.length-1]??{};
            process.stdout.write(r.status==='ok'
              ? \`\${r.listings_seen} listings, \${r.new_count} new, \${r.removed_count} removed, \${r.changed_count} changed\`
              : \`run failed: \${(r.error??'unknown').slice(0,80)}\`);
          ")
          git commit -m "history: $SUMMARY [skip ci]"
          # Another run may have pushed in the meantime.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push attempt $i failed, retrying"; sleep 5
          done

      - name: Build dashboard
        id: build
        if: always()
        run: |
          node --experimental-sqlite --no-warnings src/build-site.js
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: always() && hashFiles('dist/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Scrape result"
            echo ""
            echo '```'
            tail -30 scrape.out 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: scrape
    # Publish even if the scrape failed, so the dashboard keeps showing the last good data
    # (with its "last attempt failed" banner) rather than going stale silently. Skipped only
    # when there is no artifact to deploy.
    if: always() && needs.scrape.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
